name: lg_tv_remote
description: LG TV Remote and Screen Mirroring App
publish_to: 'version_override'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  http: ^1.2.1
  network_info_plus: ^6.1.0
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0
  provider: ^6.1.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
